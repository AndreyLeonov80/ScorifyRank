services:
  x-files-license-server:
    image: ${XFILES_LICENSE_SERVER_IMAGE:-x-files-license-server:latest}
    container_name: x-files-license-server
    restart: unless-stopped
    ports:
      - "${XFILES_LICENSE_SERVER_BIND:-127.0.0.1}:${XFILES_LICENSE_SERVER_PORT:-8015}:8015"
    environment:
      XFILES_LICENSE_SERVER_DATA_DIR: /license-server-data
      XFILES_LICENSE_SERVER_PORT: "8015"
      XFILES_LICENSE_SERVER_ADMIN_USER: ${XFILES_LICENSE_SERVER_ADMIN_USER:-owner}
      XFILES_LICENSE_SERVER_ADMIN_PASSWORD: ${XFILES_LICENSE_SERVER_ADMIN_PASSWORD:?set XFILES_LICENSE_SERVER_ADMIN_PASSWORD}
      XFILES_LICENSE_SERVER_RATE_MAX_REQUESTS: ${XFILES_LICENSE_SERVER_RATE_MAX_REQUESTS:-120}
      XFILES_LICENSE_SERVER_RATE_WINDOW_SECONDS: ${XFILES_LICENSE_SERVER_RATE_WINDOW_SECONDS:-60}
    volumes:
      - ./license-server-data:/license-server-data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/api/license/trust-time', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
